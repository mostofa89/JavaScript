<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>
<body>
    <button class="mode">Change Theme</button>
    <br><br>
    <button class="btn-onclick">OnClick</button>
    <br>
    <div class="box-conclick">
        <button class="btn-box">Show</button>
        <div class="box-content" style="display: none;">
            <p>This is the box content that can be shown or hidden.</p>

    </div>


    <div class="dbclick">
        <button class="btn-dbclick">Double Click Me</button>
        <p class="dbclick-text" style="display: none;">You double-clicked the button!</p>

    </div>


    <div class="hover-box" style="margin-top: 20px; padding: 10px; border: 1px solid black; display: inline-block; cursor: pointer; width: 150px; text-align: center; height: 150px;">
        <p class="mousehover-text">Place your mouse cursor.</p>
    </div>

    <script src="onClick.js"></script>
    <script src="dbclick.js"></script>
    <script src="mouseOver.js"></script>

</body>
</html>
